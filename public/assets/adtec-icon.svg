<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- ADTEC Icon - Blue gradient overlapping rectangles -->
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5DADE2;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3498DB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2874A6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Back rectangle (rotated) -->
  <rect x="80" y="120" width="160" height="200" rx="20" 
        fill="url(#blueGrad)" 
        transform="rotate(-25 160 220)" 
        opacity="0.7"/>
  
  <!-- Front rectangle (rotated opposite direction) -->
  <rect x="160" y="120" width="160" height="200" rx="20" 
        fill="url(#blueGrad)" 
        transform="rotate(25 240 220)"/>
</svg>
